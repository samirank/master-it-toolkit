name: Cross-platform checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==48.0.1
      - run: node .github/tests/validate-paths.cjs
      - run: node .github/tests/validate-structure.cjs
      - run: python .github/tests/test_inventory.py
      - run: python .github/tests/test_organization.py
      - run: python .github/tests/test_launcher.py
      - run: python .github/tests/test_downloads.py
      - run: python .github/tests/test_catalog.py
      - run: python .github/tests/test_transfer_manager.py
      - run: python .github/tests/test_installs.py
      - run: python .github/tests/test_host_inventory.py
      - run: python .github/tests/test_portable_tools.py
      - run: python .github/tests/test_builds.py
      - run: python .github/tests/test_toolkit_backup.py
      - run: python .github/tests/test_vault.py
      - run: python .github/tests/test_encrypted_backup.py
      - run: python .github/tests/test_workflow_jobs.py
      - run: python .github/tests/test_migration.py
      - run: python .github/tests/test_setup_wizard.py
      - run: python .github/tests/test_persistence.py
      - run: python .github/tests/test_assistant.py
      - run: python .github/tests/test_portable_ai.py
      - run: python .github/tests/test_browser_host.py
