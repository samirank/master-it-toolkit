name: Refresh download catalog
on:
  schedule:
    - cron: '23 5,17 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: download-catalog
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - name: Read previous catalog
        shell: bash
        run: |
          mkdir -p catalog-output
          if git ls-remote --exit-code --heads origin download-catalog; then
            git fetch origin download-catalog
            git show FETCH_HEAD:catalog.json > catalog-output/catalog.json
          fi
      - name: Resolve publisher packages and notify on changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/refresh_download_catalog.py --output catalog-output/catalog.json --notify
      - name: Publish catalog branch
        shell: bash
        run: |
          cd catalog-output
          git init -b download-catalog
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" fetch origin download-catalog || true
          if git rev-parse --verify FETCH_HEAD >/dev/null 2>&1; then git reset --soft FETCH_HEAD; fi
          git add catalog.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh publisher download catalog'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:download-catalog
        env:
          GH_TOKEN: ${{ github.token }}
